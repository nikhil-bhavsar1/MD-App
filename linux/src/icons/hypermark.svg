<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B13"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#070B13"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="#1F2A3F" stroke-width="6"/>

  <!-- Glowing Grid Lines -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="80" y1="352" x2="432" y2="352" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="160" y1="80" x2="160" y2="432" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="256" y1="80" x2="256" y2="432" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="352" y1="80" x2="352" y2="432" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Network Curved Bézier Connectors -->
  <path d="M 140 180 Q 220 220, 256 160" stroke="#00E5FF" stroke-width="5" fill="none" opacity="0.8"/>
  <path d="M 256 160 Q 320 200, 370 230" stroke="#C084FC" stroke-width="5" fill="none" opacity="0.8"/>
  <path d="M 140 180 Q 180 320, 230 360" stroke="#FBBF24" stroke-width="4" stroke-dasharray="8 6" fill="none" opacity="0.7"/>
  <path d="M 370 230 Q 320 340, 230 360" stroke="#34D399" stroke-width="5" fill="none" opacity="0.8"/>
  <path d="M 256 160 Q 256 280, 230 360" stroke="#00E5FF" stroke-width="4" fill="none" opacity="0.5"/>

  <!-- Pulsing Radar Ripple Rings around Main Node (256, 160) -->
  <circle cx="256" cy="160" r="64" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.4" fill="none"/>
  <circle cx="256" cy="160" r="48" stroke="#00E5FF" stroke-width="4" stroke-opacity="0.7" fill="none"/>

  <!-- Graph Nodes -->
  <!-- Center Main Node -->
  <circle cx="256" cy="160" r="32" fill="#16233B" stroke="#00E5FF" stroke-width="6" filter="url(#glow)"/>
  <circle cx="256" cy="160" r="14" fill="#00E5FF"/>

  <!-- Node Left -->
  <circle cx="140" cy="180" r="24" fill="#16233B" stroke="#38BDF8" stroke-width="5"/>
  <circle cx="140" cy="180" r="10" fill="#38BDF8"/>

  <!-- Node Right -->
  <circle cx="370" cy="230" r="26" fill="#241433" stroke="#C084FC" stroke-width="5"/>
  <circle cx="370" cy="230" r="11" fill="#C084FC"/>

  <!-- Node Bottom -->
  <circle cx="230" cy="360" r="26" fill="#14261D" stroke="#34D399" stroke-width="5"/>
  <circle cx="230" cy="360" r="11" fill="#34D399"/>

  <!-- Markdown 'M' Logo in Lower Right -->
  <g transform="translate(290, 310) scale(0.7)">
    <rect x="0" y="0" width="160" height="100" rx="18" fill="#0E1626" stroke="#00E5FF" stroke-width="4" opacity="0.95"/>
    <!-- M shape -->
    <path d="M 25 75 L 25 25 L 55 50 L 85 25 L 85 75" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Down Arrow shape -->
    <path d="M 120 30 L 120 70 M 105 55 L 120 70 L 135 55" fill="none" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
